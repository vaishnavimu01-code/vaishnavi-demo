```html
<!DOCTYPE html>
<html>
<head>
    <title>Simple Demo Project</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        h1 {
            color: #333;
        }

        .message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Simple Demo Project</h1>

        <p>Enter your name below</p>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <br>

            <button type="submit">Submit</button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

    </div>

</body>
</html>
```
